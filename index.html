<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolling Sky QAQA Tileset</title>
<style>
@font-face {
  font-family: 'BigFont';
  src: url('font/bigfont.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'Sen';
  src: url('font/sen-bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: 'Sen';
  src: url('font/sen-regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Sen",sans-serif;
}
/* 顶部语言栏 */
.lang-bar{
  width:100%;
  height:48px;
  background:#111111;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0 24px;
  position:sticky;
  top:0;
  z-index:1000;
}
.lang-switch{
  background:#222;
  color:#fff;
  border:1px solid #444;
  padding:6px 14px;
  border-radius:6px;
  cursor:pointer;
  transition:0.2s;
}
.lang-switch:hover{
  background:#333;
}
body{
  color:#fff;
  padding:40px 0 40px 48px;
  position: relative;
  min-height: 100vh;
  background: transparent;
}
body::before{
  content:"";
  position: fixed;
  inset:0;
  z-index:-1;
  background-image: url("assets/2.png");
  background-repeat: no-repeat;
  background-size: cover;
  background-position: center center;
  background-color: rgba(0,0,0,0.7);
  background-blend-mode: multiply;
}
.title-main{
  font-family:"BigFont",sans-serif;
  font-size:64px;
  margin-bottom:32px;
  letter-spacing:2px;
  color:#ffffff;
  opacity:0;
  transform:translateY(-20px);
  animation: titleIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
}
@keyframes titleIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.row-wrap{
  display:flex;
  gap:40px;
  align-items:flex-start;
  flex-wrap:wrap;
  margin-bottom:40px;
  opacity:0;
  transform:translateY(24px);
  animation: rowIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.25s forwards;
}
@keyframes rowIn{
  to{
    opacity:1;
    transform:translateY(0);
  }
}
.menu-container{
  display:flex;
  flex-direction:column;
  gap:18px;
  width: 520px;
  max-width: 92vw;
}
.side-img{
  max-height:440px;
  max-width:460px;
  width:auto;
  height:auto;
  border-radius:14px;
  object-fit:contain;
  opacity:0;
  transform:scale(0.96);
  animation: imgIn 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.45s forwards;
}
@keyframes imgIn{
  to{
    opacity:1;
    transform:scale(1);
  }
}
.main-btn{
  width: 520px;
  max-width: 92vw;
  padding:20px 24px;
  font-size:20px;
  border:none;
  border-radius:12px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  text-align:left;
  transition: background 0.25s ease, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
  box-shadow: 0 6px 14px rgba(37, 99, 235, 0.25);
}
.main-btn:hover{
  background:#1d4ed8;
  transform:translateX(6px);
  box-shadow: 0 10px 20px rgba(29, 78, 216, 0.35);
}
.main-btn:active{
  transform:translateX(2px) scale(0.996);
}
.collapse-wrap{
  overflow:hidden;
  border:1px solid #333;
  border-radius:0 0 12px 12px;
  background:#18181b;
  width: 520px;
  max-width: 92vw;
  height:0;
  transition: height 0.45s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease;
}
.collapse-wrap.open{
  border-color:#444;
}
.sub-group{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:16px 20px;
}
.sub-btn{
  width: 100%;
  padding:16px 18px;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#222;
  color:#ddd;
  cursor:pointer;
  text-align:left;
  display:flex;
  align-items:center;
  gap:12px;
  opacity:0;
  transform:translateX(-10px);
  transition: background 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.sub-btn:hover{
  background:#2a2a31;
  transform:translateX(4px);
}
.sub-btn.show{
  opacity:1;
  transform:translateX(0);
}
.sub-btn img{
  width:24px;
  height:24px;
  object-fit:contain;
}
.announce-box{
  max-width:700px;
  background:#18181b;
  padding:20px;
  border-radius:10px;
  margin-bottom:30px;
  border:1px solid #333;
}
.announce-box h3{
  margin-bottom:10px;
  color:#93c5fd;
}
.download-section{
  max-width:700px;
}
.download-section h3{
  margin-bottom:16px;
  font-size:20px;
}
.file-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#18181b;
  padding:14px 18px;
  border-radius:8px;
  margin-bottom:10px;
  opacity:0;
  transform:translateY(12px);
  transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
}
.file-item.show{
  opacity:1;
  transform:translateY(0);
}
.file-item:hover{
  background:#202026;
  transform:translateY(-3px);
  box-shadow: 0 10px 24px rgba(0,0,0,0.25);
}
.file-item-left{
  display:flex;
  align-items:center;
  gap:10px;
}
.file-item-left img{
  width:26px;
  height:26px;
}
.dl-btn{
  padding:11px 18px;
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:8px;
  cursor:pointer;
  transition: background 0.2s ease, transform 0.2s ease;
}
.dl-btn:hover{
  background:#15803d;
  transform: translateY(-2px);
}
.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  transition: background-color 0.35s ease;
}
.modal-wrap.open{
  display:flex;
  background-color:rgba(0,0,0,0.75);
}
.modal{
  background:#18181b;
  padding:28px;
  border-radius:12px;
  max-width:560px;
  width:90%;
  transform: scale(0.88) translateY(10px);
  opacity:0;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
}
.modal-wrap.open .modal{
  transform: scale(1) translateY(0);
  opacity:1;
}
.modal h3{
  margin-bottom:16px;
}
.modal img{
  max-width:100%;
  border-radius:6px;
  margin:14px 0;
}
.modal p{
  margin-bottom:18px;
  color:#ccc;
  line-height:1.6;
}
.modal a{
  color:#60a5fa;
}
.close-btn{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:#333;
  color:white;
  cursor:pointer;
  transition: background 0.2s ease;
}
.close-btn:hover{
  background:#444;
}
.load-text{
  color:#aaa;
}
.err-text{
  color:#f87171;
}
.last-update-text{
  position: fixed;
  bottom:14px;
  left:20px;
  color:#aaa;
  font-size:14px;
  z-index:10;
}
</style>
</head>
<body>
<div class="lang-bar">
  <button class="lang-switch" id="langBtn">中文</button>
</div>

<h1 class="title-main">ROLLING SKY QAQA TILESET</h1>

<div class="row-wrap">
  <div class="menu-container">
    <div>
      <button class="main-btn" onclick="toggleAuthor(event)" data-en="Author Home" data-cn="作者主页">Author Home</button>
      <div class="collapse-wrap" id="authorCollapse" style="height:0;">
        <div class="sub-group" id="authorSub">
          <a class="sub-btn" href="https://space.bilibili.com/1276761356?spm_id_from=333.1007.0.0" target="_blank">
            <img src="icons/bilibili.png" alt=""> Bilibili
          </a>
          <a class="sub-btn" href="https://youtube.com/@qaqa-blackwhitelolqq?si=XZ_wCdgHpNeyVJQE" target="_blank">
            <img src="icons/youtube.png" alt=""> YouTube
          </a>
        </div>
      </div>
    </div>

    <div>
      <button class="main-btn" onclick="toggleRelated(event)" data-en="Related Links" data-cn="相关链接">Related Links</button>
      <div class="collapse-wrap" id="relatedCollapse" style="height:0;">
        <div class="sub-group" id="relatedSub">
          <div id="linkTip" data-en="Click to load links..." data-cn="点击加载链接...">Click to load links...</div>
        </div>
      </div>
    </div>

    <button class="main-btn" onclick="openTutorial(event)" data-en="Tutorial" data-cn="教程">Tutorial</button>
  </div>
  <img class="side-img" src="assets/a.png" alt="Side preview">
</div>

<div class="announce-box">
  <h3 data-en="Announcement" data-cn="公告">Announcement</h3>
  <div id="announce-content" class="load-text" data-en="Loading announcement..." data-cn="正在加载公告...">Loading announcement...</div>
</div>

<div class="download-section">
  <h3 data-en="Assets Download List" data-cn="资源下载列表">Assets Download List</h3>
  <div id="fileList" class="load-text" data-en="Loading download list..." data-cn="正在加载下载列表...">Loading download list...</div>
</div>

<div class="modal-wrap" id="tutorialModal">
  <div class="modal">
    <h3 data-en="Tutorial" data-cn="教程">Tutorial</h3>
    <p data-en="Download Tiled here: " data-cn="在这里下载Tiled：">Download Tiled here: </p>
    <a href="https://www.mapeditor.org/" target="_blank">Tiled Official Site</a>
    <img src="assets/1.png" alt="guide">
    <p data-en="Use this image as shown in the picture." data-cn="如图所示来使用这张图片">Use this image as shown in the picture.</p>
    <button class="close-btn" onclick="closeTutorial()" data-en="Close" data-cn="关闭">Close</button>
  </div>
</div>

<div class="last-update-text" id="updateTimer">Calculating time since last edit...</div>

<script>
let linkLoaded = false;
let linkList = [];
let downloadList = [];
let authorOpen = false;
let relatedOpen = false;
const lastEditTime = new Date(2026, 9, 24, 20, 0, 0);

// 语言缓存 & 切换
const langBtn = document.getElementById("langBtn");
let currentLang = localStorage.getItem("lang") || "en";

function applyLang(){
  if(currentLang === "en"){
    langBtn.textContent = "中文";
  }else{
    langBtn.textContent = "English";
  }
  document.querySelectorAll("[data-en]").forEach(el=>{
    el.textContent = currentLang === "en" ? el.dataset.en : el.dataset.cn;
  })
}
langBtn.onclick = ()=>{
  currentLang = currentLang === "en" ? "cn" : "en";
  localStorage.setItem("lang", currentLang);
  applyLang();
}
applyLang();

function clickPop(btn){
  btn.style.transform = "scale(0.97)";
  setTimeout(()=>{
    btn.style.transform = "";
  }, 120);
}

function formatTimeDiff(ms) {
  let sec = Math.floor(ms / 1000);
  const days = Math.floor(sec / 86400);
  sec %= 86400;
  const hours = Math.floor(sec / 3600);
  sec %= 3600;
  const mins = Math.floor(sec / 60);
  sec = sec % 60;
  return `${days}d ${hours}h ${mins}m ${sec}s since last edit`;
}
function updateTimer(){
  const now = new Date();
  const diff = now - lastEditTime;
  document.getElementById("updateTimer").innerText = formatTimeDiff(diff);
}

function getElHeight(el){
  const prev = el.style.display;
  el.style.display = 'flex';
  const h = el.scrollHeight;
  el.style.display = prev;
  return h;
}

function fadeInSubButtons(container){
  const buttons = container.querySelectorAll(".sub-btn");
  buttons.forEach((btn, i)=>{
    btn.classList.remove("show");
    setTimeout(()=>{
      btn.classList.add("show");
    }, 60 + i * 55);
  });
}

function toggleAuthor(e){
  clickPop(e.currentTarget);
  const wrap = document.getElementById("authorCollapse");
  const content = document.getElementById("authorSub");
  authorOpen = !authorOpen;
  if(authorOpen){
    wrap.style.height = getElHeight(content) + "px";
    wrap.classList.add("open");
    fadeInSubButtons(content);
  }else{
    wrap.classList.remove("open");
    wrap.style.height = "0px";
  }
}

async function toggleRelated(e){
  clickPop(e.currentTarget);
  const wrap = document.getElementById("relatedCollapse");
  const content = document.getElementById("relatedSub");
  relatedOpen = !relatedOpen;
  if(relatedOpen){
    if(!linkLoaded) await fetchLinkData();
    wrap.style.height = getElHeight(content) + "px";
    wrap.classList.add("open");
    fadeInSubButtons(content);
  }else{
    wrap.classList.remove("open");
    wrap.style.height = "0px";
  }
}

async function fetchLinkData(){
  const tip = document.getElementById("linkTip");
  tip.textContent = currentLang === "en" ? "Loading list.js..." : "正在加载链接列表...";
  try{
    const res = await fetch("./list.js");
    if(!res.ok) throw new Error("File not found");
    const rawText = await res.text();
    linkList = JSON.parse(rawText);
    if(Array.isArray(linkList)){
      linkLoaded = true;
      renderLinks();
    }else{
      tip.innerHTML = `<span class="err-text">${currentLang === "en" ? "Data is not array" : "数据不是数组"}</span>`;
    }
  }catch(e){
    tip.innerHTML = `<span class="err-text">${currentLang === "en" ? "Error: " : "错误："}${e.message}</span>`;
    console.error(e);
  }
}

function renderLinks(){
  const wrap = document.getElementById("relatedSub");
  wrap.innerHTML = "";
  linkList.forEach((item, index)=>{
    const a = document.createElement("a");
    a.className = "sub-btn";
    a.target = "_blank";
    a.href = item.url;
    a.innerHTML = `<img src="${item.icon}" alt=""> ${item.name}`;
    wrap.appendChild(a);
    setTimeout(()=>{
      a.classList.add("show");
    }, 80 + index * 60);
  })
}

function openTutorial(e){
  clickPop(e.currentTarget);
  const modal = document.getElementById("tutorialModal");
  modal.classList.add("open");
}
function closeTutorial(){
  const modal = document.getElementById("tutorialModal");
  modal.classList.remove("open");
}

async function loadAnnouncement(){
  try{
    const res = await fetch("https://raw.githubusercontent.com/QAQA114514/annoucement/main/base.txt");
    if(!res.ok) throw new Error();
    const text = await res.text();
    document.getElementById("announce-content").innerText = text;
  }catch(e){
    document.getElementById("announce-content").innerText = currentLang === "en" ? "Announcement load failed." : "公告加载失败。";
  }
}

// 下载逻辑
function downloadFileDirect(url){
  window.open(url,"_blank");
}

// 读取download.js渲染下载列表
async function loadDownloadList(){
  const container = document.getElementById("fileList");
  try{
    const res = await fetch("./download.js");
    if(!res.ok) throw new Error();
    const raw = await res.text();
    // 执行js拿到downloadList变量
    const script = document.createElement('script');
    script.textContent = raw;
    document.body.appendChild(script);
    script.remove();

    container.innerHTML = "";
    downloadList.forEach((item, i)=>{
      const div = document.createElement("div");
      div.className = "file-item";
      div.innerHTML = `
        <div class="file-item-left">
          <img src="${item.icon}" alt="">
          <span>${item.name}</span>
        </div>
        <button class="dl-btn" onclick="downloadFileDirect('${item.url}')">Download</button>
      `;
      container.appendChild(div);
      setTimeout(()=>{
        div.classList.add("show");
      }, 120 + i * 80);
    })
  }catch(e){
    container.innerText = currentLang === "en" ? "Download list load failed." : "下载列表加载失败。";
    console.error(e);
  }
}

window.onload = ()=>{
  loadAnnouncement();
  loadDownloadList();
  updateTimer();
  setInterval(updateTimer,1000);
}
</script>
</body>
</html>
