<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolling Sky QAQA Tileset</title>
<style>
@font-face {
  font-family: 'BigFont';
  src: url('font/bigfont.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
@font-face {
  font-family: 'Sen';
  src: url('font/sen-bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: 'Sen';
  src: url('font/sen-regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Sen",sans-serif;
}
body{
  background:#111;
  color:#fff;
  padding:40px 0 40px 48px;
}
.title-main{
  font-family:"BigFont",sans-serif;
  font-size:64px;
  margin-bottom:32px;
  letter-spacing:2px;
  color:#ffffff;
}
.menu-container{
  display:flex;
  flex-direction:column;
  gap:18px;
  max-width:420px;
  margin-bottom:40px;
}
.main-btn{
  width:100%;
  padding:18px 20px;
  font-size:19px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  text-align:left;
  transition: background 0.25s ease;
}
.main-btn:hover{
  background:#1d4ed8;
}
/* 折叠容器：带框 + 高度平滑动画 */
.collapse-wrap{
  overflow:hidden;
  border:1px solid #333;
  border-radius:0 0 10px 10px;
  background:#18181b;
  max-width:420px;
  transition: height 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}
.sub-group{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding:16px 20px;
}
.sub-btn{
  padding:14px 16px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#222;
  color:#ddd;
  cursor:pointer;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
  transition: background 0.2s ease;
}
.sub-btn:hover{
  background:#333;
}
.sub-btn img{
  width:24px;
  height:24px;
  object-fit:contain;
}
.announce-box{
  max-width:700px;
  background:#18181b;
  padding:20px;
  border-radius:10px;
  margin-bottom:30px;
  border:1px solid #333;
}
.announce-box h3{
  margin-bottom:10px;
  color:#93c5fd;
}
.download-section{
  max-width:700px;
}
.download-section h3{
  margin-bottom:16px;
  font-size:20px;
}
.file-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#18181b;
  padding:14px 18px;
  border-radius:8px;
  margin-bottom:10px;
  transition: transform 0.2s ease, background 0.2s ease;
}
.file-item:hover{
  background:#202026;
  transform: translateY(-2px);
}
.dl-btn{
  padding:10px 16px;
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
  transition: background 0.2s ease;
}
.dl-btn:hover{
  background:#15803d;
}
.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
  opacity:0;
  transition: opacity 0.3s ease;
}
.modal-wrap.open{
  display:flex;
  opacity:1;
}
.modal{
  background:#18181b;
  padding:28px;
  border-radius:12px;
  max-width:560px;
  width:90%;
  transform: scale(0.92);
  transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
}
.modal-wrap.open .modal{
  transform: scale(1);
}
.modal h3{
  margin-bottom:16px;
}
.modal img{
  max-width:100%;
  border-radius:6px;
  margin:14px 0;
}
.modal p{
  margin-bottom:18px;
  color:#ccc;
  line-height:1.6;
}
.modal a{
  color:#60a5fa;
}
.close-btn{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:#333;
  color:white;
  cursor:pointer;
  transition: background 0.2s ease;
}
.close-btn:hover{
  background:#444;
}
.load-text{
  color:#aaa;
}
.err-text{
  color:#f87171;
}
/* 固定在页面底部，滚动不会动 */
.last-update-text{
  position: fixed;
  bottom:14px;
  left:20px;
  color:#aaa;
  font-size:14px;
  z-index:10;
}
</style>
</head>
<body>
<h1 class="title-main">ROLLING SKY QAQA TILESET</h1>

<div class="menu-container">
  <div>
    <button class="main-btn" onclick="toggleAuthor()">Author Home</button>
    <div class="collapse-wrap" id="authorCollapse" style="height:0;">
      <div class="sub-group" id="authorSub">
        <a class="sub-btn" href="https://space.bilibili.com/1276761356?spm_id_from=333.1007.0.0" target="_blank">
          <img src="icons/bilibili.png" alt=""> Bilibili
        </a>
        <a class="sub-btn" href="https://youtube.com/@qaqa-blackwhitelolqq?si=XZ_wCdgHpNeyVJQE" target="_blank">
          <img src="icons/youtube.png" alt=""> YouTube
        </a>
      </div>
    </div>
  </div>

  <div>
    <button class="main-btn" onclick="toggleRelated()">Related Links</button>
    <div class="collapse-wrap" id="relatedCollapse" style="height:0;">
      <div class="sub-group" id="relatedSub">
        <div id="linkTip">Click to load links...</div>
      </div>
    </div>
  </div>

  <button class="main-btn" onclick="openTutorial()">Tutorial</button>
</div>

<div class="announce-box">
  <h3>Announcement</h3>
  <div id="announce-content" class="load-text">Loading announcement...</div>
</div>

<div class="download-section">
  <h3>Assets Download List</h3>
  <div id="fileList" class="load-text">Loading asset files...</div>
</div>

<div class="modal-wrap" id="tutorialModal">
  <div class="modal">
    <h3>Tutorial</h3>
    <p>Download Tiled here: <a href="https://www.mapeditor.org/" target="_blank">Tiled Official Site</a></p>
    <img src="assets/1.png" alt="guide">
    <p>Use this image as shown in the picture.</p>
    <button class="close-btn" onclick="closeTutorial()">Close</button>
  </div>
</div>

<!-- 固定底部文字 -->
<div class="last-update-text" id="updateTimer">Calculating time since last edit...</div>

<script>
let linkLoaded = false;
let linkList = [];
let authorOpen = false;
let relatedOpen = false;
// =========在这里填写上次修改的时间=========
// 格式：年,月,日,时,分,秒
const lastEditTime = new Date(2026, 9, 24, 20, 0, 0);

// 计算时间差函数
function formatTimeDiff(ms) {
  let sec = Math.floor(ms / 1000);
  const days = Math.floor(sec / 86400);
  sec %= 86400;
  const hours = Math.floor(sec / 3600);
  sec %= 3600;
  const mins = Math.floor(sec / 60);
  sec = sec % 60;
  return `${days}d ${hours}h ${mins}m ${sec}s since last edit`;
}
function updateTimer(){
  const now = new Date();
  const diff = now - lastEditTime;
  document.getElementById("updateTimer").innerText = formatTimeDiff(diff);
}

// 获取元素真实高度辅助函数
function getElHeight(el){
  const prev = el.style.display;
  el.style.display = 'flex';
  const h = el.scrollHeight;
  el.style.display = prev;
  return h;
}

function toggleAuthor(){
  const wrap = document.getElementById("authorCollapse");
  const content = document.getElementById("authorSub");
  authorOpen = !authorOpen;
  if(authorOpen){
    wrap.style.height = getElHeight(content)+"px";
  }else{
    wrap.style.height = "0px";
  }
}

async function toggleRelated(){
  const wrap = document.getElementById("relatedCollapse");
  const content = document.getElementById("relatedSub");
  relatedOpen = !relatedOpen;
  if(relatedOpen){
    if(!linkLoaded) await fetchLinkData();
    wrap.style.height = getElHeight(content)+"px";
  }else{
    wrap.style.height = "0px";
  }
}

async function fetchLinkData(){
  const tip = document.getElementById("linkTip");
  tip.textContent = "Loading list.js...";
  try{
    const res = await fetch("./list.js");
    if(!res.ok) throw new Error("File not found, check filename & path");
    const rawText = await res.text();
    linkList = JSON.parse(rawText);
    if(Array.isArray(linkList)){
      linkLoaded = true;
      renderLinks();
    }else{
      tip.innerHTML = `<span class="err-text">Data is not array</span>`;
    }
  }catch(e){
    tip.innerHTML = `<span class="err-text">Error: ${e.message}</span>`;
    console.error(e);
  }
}

function renderLinks(){
  const wrap = document.getElementById("relatedSub");
  wrap.innerHTML = "";
  linkList.forEach(item=>{
    const a = document.createElement("a");
    a.className = "sub-btn";
    a.target = "_blank";
    a.href = item.url;
    a.innerHTML = `<img src="${item.icon}" alt=""> ${item.name}`;
    wrap.appendChild(a);
  })
}

function openTutorial(){
  const modal = document.getElementById("tutorialModal");
  modal.classList.add("open");
}
function closeTutorial(){
  const modal = document.getElementById("tutorialModal");
  modal.classList.remove("open");
}

async function loadAnnouncement(){
  try{
    const res = await fetch("https://raw.githubusercontent.com/QAQA114514/annoucement/main/base.txt");
    if(!res.ok) throw new Error();
    const text = await res.text();
    document.getElementById("announce-content").innerText = text;
  }catch(e){
    document.getElementById("announce-content").innerText = "Announcement load failed.";
  }
}

async function loadAssetList(){
  const container = document.getElementById("fileList");
  try{
    const apiUrl = "https://api.github.com/repos/QAQA114514/rolling-sky-ugc-web-mod-assets/contents";
    const resp = await fetch(apiUrl);
    const data = await resp.json();
    container.innerHTML = "";
    data.forEach(file=>{
      if(file.type === "file"){
        const div = document.createElement("div");
        div.className = "file-item";
        div.innerHTML = `
          <span>${file.name}</span>
          <button class="dl-btn" onclick="downloadFile('${file.download_url}','${file.name}')">Download</button>
        `;
        container.appendChild(div);
      }
    })
  }catch(e){
    container.innerText = "Asset list load failed.";
  }
}

async function downloadFile(url, filename){
  const res = await fetch(url);
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

window.onload = ()=>{
  loadAnnouncement();
  loadAssetList();
  updateTimer();
  setInterval(updateTimer,1000);
}
</script>
</body>
</html>
