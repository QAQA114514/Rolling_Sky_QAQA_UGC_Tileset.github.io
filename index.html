<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolling Sky UGC Mod Assets</title>
<style>
@font-face {
  font-family: 'Sen';
  src: url('font/sen-bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: 'Sen';
  src: url('font/sen-regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Sen",sans-serif;
}
body{
  background:#111;
  color:#fff;
  padding:40px 0 40px 48px;
}
/* 左侧菜单列表 */
.menu-container{
  display:flex;
  flex-direction:column;
  gap:18px;
  max-width:420px;
  margin-bottom:40px;
}
/* 放大主按钮 */
.main-btn{
  width:100%;
  padding:18px 20px;
  font-size:19px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  text-align:left;
  transition:0.2s;
}
.main-btn:hover{
  background:#1d4ed8;
}
.sub-group{
  display:flex;
  flex-direction:column;
  gap:12px;
  padding-left:24px;
  margin-top:8px;
}
.sub-btn{
  padding:14px 16px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#222;
  color:#ddd;
  cursor:pointer;
  text-align:left;
  display:flex;
  align-items:center;
  gap:10px;
}
.sub-btn:hover{
  background:#333;
}
.sub-btn img{
  width:24px;
  height:24px;
  object-fit:contain;
}
/* 公告区域 */
.announce-box{
  max-width:700px;
  background:#18181b;
  padding:20px;
  border-radius:10px;
  margin-bottom:30px;
  border:1px solid #333;
}
.announce-box h3{
  margin-bottom:10px;
  color:#93c5fd;
}
/* 下载列表区域（原版下载界面） */
.download-section{
  max-width:700px;
}
.download-section h3{
  margin-bottom:16px;
  font-size:20px;
}
.file-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#18181b;
  padding:14px 18px;
  border-radius:8px;
  margin-bottom:10px;
}
.dl-btn{
  padding:10px 16px;
  background:#16a34a;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.dl-btn:hover{
  background:#15803d;
}
/* 弹窗 */
.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal{
  background:#18181b;
  padding:28px;
  border-radius:12px;
  max-width:560px;
  width:90%;
}
.modal h3{
  margin-bottom:16px;
}
.modal img{
  max-width:100%;
  border-radius:6px;
  margin:14px 0;
}
.modal p{
  margin-bottom:18px;
  color:#ccc;
  line-height:1.6;
}
.modal a{
  color:#60a5fa;
}
.close-btn{
  padding:10px 16px;
  border:none;
  border-radius:6px;
  background:#333;
  color:white;
  cursor:pointer;
}
.load-text{
  color:#aaa;
}
</style>
</head>
<body>

<!-- 左侧主菜单列表 -->
<div class="menu-container">
  <button class="main-btn" onclick="location.href='https://sqdldev.github.io/rolling-sky/tileset/'">jump into sqdl download web</button>

  <div>
    <button class="main-btn" onclick="toggleAuthor()">Author Home</button>
    <div class="sub-group" id="authorSub" style="display:none">
      <a class="sub-btn" href="https://space.bilibili.com/1276761356?spm_id_from=333.1007.0.0" target="_blank">
        <img src="icons/bilibili.png" alt=""> Bilibili
      </a>
      <a class="sub-btn" href="https://youtube.com/@qaqa-blackwhitelolqq?si=XZ_wCdgHpNeyVJQE" target="_blank">
        <img src="icons/youtube.png" alt=""> YouTube
      </a>
    </div>
  </div>

  <div>
    <button class="main-btn" onclick="toggleRelated()">Related Links</button>
    <div class="sub-group" id="relatedSub" style="display:none">
      <!-- link.js动态渲染 -->
    </div>
  </div>

  <button class="main-btn" onclick="openTutorial()">Tutorial</button>
</div>

<!-- 公告模块 -->
<div class="announce-box">
  <h3>Announcement</h3>
  <div id="announce-content" class="load-text">Loading announcement...</div>
</div>

<!-- 原版下载界面 -->
<div class="download-section">
  <h3>Assets Download List</h3>
  <div id="fileList" class="load-text">Loading asset files...</div>
</div>

<!-- 教程弹窗 -->
<div class="modal-wrap" id="tutorialModal">
  <div class="modal">
    <h3>Tutorial</h3>
    <p>Download Tiled here: <a href="https://www.mapeditor.org/" target="_blank">Tiled Official Site</a></p>
    <img src="assets/1.png" alt="guide">
    <p>Use this image as shown in the picture.</p>
    <button class="close-btn" onclick="closeTutorial()">Close</button>
  </div>
</div>

<script src="./link.js"></script>
<script>
// 菜单展开
function toggleAuthor(){
  const el = document.getElementById("authorSub");
  el.style.display = el.style.display === "none" ? "flex" : "none";
}
function toggleRelated(){
  const el = document.getElementById("relatedSub");
  if(el.style.display === "none"){
    el.style.display = "flex";
    renderLinks();
  }else{
    el.style.display = "none";
  }
}
// 渲染link.js链接
function renderLinks(){
  const wrap = document.getElementById("relatedSub");
  if(!window.linkList){
    wrap.innerHTML = "<span style='color:#aaa'>link.js not found / load failed</span>";
    return;
  }
  wrap.innerHTML = "";
  linkList.forEach(item=>{
    const a = document.createElement("a");
    a.className = "sub-btn";
    a.target = "_blank";
    a.href = item.url;
    a.innerHTML = `<img src="${item.icon}" alt=""> ${item.name}`;
    wrap.appendChild(a);
  })
}
// 教程弹窗
function openTutorial(){
  document.getElementById("tutorialModal").style.display="flex";
}
function closeTutorial(){
  document.getElementById("tutorialModal").style.display="none";
}

// ========== 拉取公告 annoucement.git ==========
async function loadAnnouncement(){
  try{
    const res = await fetch("https://raw.githubusercontent.com/QAQA114514/annoucement/main/announce.txt");
    if(!res.ok) throw new Error();
    const text = await res.text();
    document.getElementById("announce-content").innerText = text;
  }catch(e){
    document.getElementById("announce-content").innerText = "Announcement load failed.";
  }
}

// ========== 资产下载列表 rolling-sky-ugc-web-mod-assets.git ==========
async function loadAssetList(){
  const container = document.getElementById("fileList");
  try{
    const apiUrl = "https://api.github.com/repos/QAQA114514/rolling-sky-ugc-web-mod-assets/contents";
    const resp = await fetch(apiUrl);
    const data = await resp.json();
    container.innerHTML = "";
    data.forEach(file=>{
      if(file.type === "file"){
        const div = document.createElement("div");
        div.className = "file-item";
        div.innerHTML = `
          <span>${file.name}</span>
          <button class="dl-btn" onclick="downloadFile('${file.download_url}','${file.name}')">Download</button>
        `;
        container.appendChild(div);
      }
    })
  }catch(e){
    container.innerText = "Asset list load failed.";
  }
}
// 下载文件
async function downloadFile(url, filename){
  const res = await fetch(url);
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

// 页面初始化
window.onload = ()=>{
  loadAnnouncement();
  loadAssetList();
}
</script>
</body>
</html>
