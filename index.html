<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rolling Sky UGC Mod Assets</title>
<style>
@font-face {
  font-family: 'Sen';
  src: url('font/sen-bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: 'Sen';
  src: url('font/sen-regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:"Sen",sans-serif;
}
body{
  background:#111;
  color:#fff;
  padding:40px 0 40px 48px;
}
.menu-container{
  display:flex;
  flex-direction:column;
  gap:14px;
  max-width:340px;
}
.main-btn{
  width:100%;
  padding:12px 16px;
  font-size:16px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  cursor:pointer;
  text-align:left;
  transition:0.2s;
}
.main-btn:hover{
  background:#1d4ed8;
}
.sub-group{
  display:flex;
  flex-direction:column;
  gap:10px;
  padding-left:18px;
  margin-top:6px;
}
.sub-btn{
  padding:10px 14px;
  font-size:15px;
  border:none;
  border-radius:6px;
  background:#222;
  color:#ddd;
  cursor:pointer;
  text-align:left;
  display:flex;
  align-items:center;
  gap:8px;
}
.sub-btn:hover{
  background:#333;
}
.sub-btn img{
  width:20px;
  height:20px;
  object-fit:contain;
}
.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}
.modal{
  background:#18181b;
  padding:24px;
  border-radius:10px;
  max-width:520px;
  width:90%;
}
.modal h3{
  margin-bottom:14px;
}
.modal img{
  max-width:100%;
  border-radius:6px;
  margin:12px 0;
}
.modal p{
  margin-bottom:16px;
  color:#ccc;
}
.modal a{
  color:#60a5fa;
}
.close-btn{
  padding:8px 14px;
  border:none;
  border-radius:6px;
  background:#333;
  color:white;
  cursor:pointer;
}
</style>
</head>
<body>
<div class="menu-container">
  <button class="main-btn" onclick="location.href='https://sqdldev.github.io/rolling-sky/tileset/'">jump into sqdl download web</button>

  <div>
    <button class="main-btn" onclick="toggleAuthor()">Author Home</button>
    <div class="sub-group" id="authorSub" style="display:none">
      <a class="sub-btn" href="https://space.bilibili.com/1276761356?spm_id_from=333.1007.0.0" target="_blank">
        <img src="icons/bilibili.png" alt=""> Bilibili
      </a>
      <a class="sub-btn" href="https://youtube.com/@qaqa-blackwhitelolqq?si=XZ_wCdgHpNeyVJQE" target="_blank">
        <img src="icons/youtube.png" alt=""> YouTube
      </a>
    </div>
  </div>

  <div>
    <button class="main-btn" onclick="toggleRelated()">Related Links</button>
    <div class="sub-group" id="relatedSub" style="display:none">
      <!-- link.js 动态填充 -->
    </div>
  </div>

  <button class="main-btn" onclick="openTutorial()">Tutorial</button>
</div>

<!-- Tutorial Modal -->
<div class="modal-wrap" id="tutorialModal">
  <div class="modal">
    <h3>Tutorial</h3>
    <p>Download Tiled here: <a href="https://www.mapeditor.org/" target="_blank">Tiled Official Site</a></p>
    <img src="assets/1.png" alt="guide">
    <p>Use this image as shown in the picture.</p>
    <button class="close-btn" onclick="closeTutorial()">Close</button>
  </div>
</div>

<script src="./link.js"></script>
<script>
function toggleAuthor(){
  const el = document.getElementById("authorSub");
  el.style.display = el.style.display === "none" ? "flex" : "none";
}
function toggleRelated(){
  const el = document.getElementById("relatedSub");
  if(el.style.display === "none"){
    el.style.display = "flex";
    renderLinks();
  }else{
    el.style.display = "none";
  }
}
function renderLinks(){
  const wrap = document.getElementById("relatedSub");
  if(!window.linkList){
    wrap.innerHTML = "<span style='color:#aaa'>link.js not found / load failed</span>";
    return;
  }
  wrap.innerHTML = "";
  linkList.forEach(item=>{
    const a = document.createElement("a");
    a.className = "sub-btn";
    a.target = "_blank";
    a.href = item.url;
    a.innerHTML = `<img src="${item.icon}" alt=""> ${item.name}`;
    wrap.appendChild(a);
  })
}
function openTutorial(){
  document.getElementById("tutorialModal").style.display="flex";
}
function closeTutorial(){
  document.getElementById("tutorialModal").style.display="none";
}
</script>
</body>
</html>
